# A tag vX.Y.Z publishes this package to npm with the NPM_TOKEN secret of this repository (the granular token beltype-ci, one for the @beltype scope and the two prosemirror packages, bypass 2FA, expires 2027-02-05), with provenance. npm ends direct publishing for such tokens in January 2027.
# The house style: codeberg.org/BelType/decisions, project/a-release-moves-three-remotes-at-once.md.
# ponytail: the tests are not run here; they run on the machine before the tag is pushed. This package has no build step, so nothing is installed either.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The tag, package.json and the CHANGELOG name one version
        run: |
          v="${GITHUB_REF_NAME#v}"
          test "$(node -p 'require("./package.json").version')" = "$v" || { echo "::error::package.json does not say $v"; exit 1; }
          grep -q "^## $v " CHANGELOG.md || { echo "::error::CHANGELOG.md has no heading for $v"; exit 1; }
      - name: Publish, unless this version is on npm already (a package's first version is published by hand)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          at="$(node -p 'require("./package.json").name')@${GITHUB_REF_NAME#v}"
          if npm view "$at" version >/dev/null 2>&1; then echo "$at is on npm already"; else npm publish --provenance --access public; fi
